<!DOCTYPE html>
<html lang="en">

<head>

  <base target="_top">

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

  <title><?= config.pageTitle ?></title>

  <!-- Open Sans -->
  <link
    href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>

    /* =========================================================
       RESET
       ========================================================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    html,
    body {
      width: 100%;
      min-height: 100%;
    }


    body {

      font-family:
        "Open Sans",
        Arial,
        Helvetica,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #ffffff 0%,
          #ffffff 65%,
          #fff7f8 100%
        );

      color: #172b4d;

      min-height: 100vh;

      overflow-x: hidden;
    }


    /* =========================================================
       BACKGROUND DECORATION
       ========================================================= */

    body::before {

      content: "";

      position: fixed;

      width: 520px;
      height: 520px;

      right: -280px;
      top: -230px;

      border-radius: 50%;

      background:
        rgba(166, 25, 46, 0.035);

      pointer-events: none;
    }


    body::after {

      content: "";

      position: fixed;

      width: 420px;
      height: 420px;

      left: -260px;
      bottom: -230px;

      border-radius: 50%;

      background:
        rgba(166, 25, 46, 0.025);

      pointer-events: none;
    }


    /* =========================================================
       PAGE
       ========================================================= */

    .page {

      width: 100%;

      min-height: 100vh;

      display: flex;

      justify-content: center;

      align-items: flex-start;

      padding:
        55px 20px 60px;

      position: relative;

      z-index: 1;
    }


    /* =========================================================
       MAIN CONTAINER
       ========================================================= */

    .container {

      width: 100%;

      max-width: 760px;

      margin: 0 auto;
    }


    /* =========================================================
       MAIN CARD
       ========================================================= */

    .card {

      width: 100%;

      background: #ffffff;

      border-radius: 16px;

      border:
        1px solid #ead4d8;

      border-top:
        5px solid #A6192E;

      box-shadow:
        0 12px 40px rgba(55, 20, 28, 0.10);

      overflow: hidden;
    }


    /* =========================================================
       BRAND AREA
       ========================================================= */

    .brand {

      padding:
        35px 45px 0;

      text-align: center;
    }


    .logo {

      width: 185px;

      max-width: 70%;

      height: auto;

      display: block;

      margin:
        0 auto 25px;

      object-fit: contain;
    }


    /* =========================================================
       SINGLE MAROON DIVIDER
       ========================================================= */

    .brand-divider {

      width: 100%;

      height: 2px;

      background: #A6192E;

      margin:
        0 auto;
    }


    /* =========================================================
       INTRODUCTION
       ========================================================= */

    .intro {

      padding:
        34px 45px 30px;

      text-align: center;
    }


    .report-title {

      color: #172b4d;

      font-size: 31px;

      line-height: 1.25;

      font-weight: 800;

      letter-spacing: -0.5px;

      margin-bottom: 16px;
    }


    .report-title .highlight {

      color: #A6192E;
    }


    .description {

      max-width: 650px;

      margin:
        0 auto;

      color: #5d6b7d;

      font-size: 15px;

      line-height: 1.75;

      font-weight: 400;
    }


    /* =========================================================
       FORM AREA
       ========================================================= */

    .form-area {

      margin:
        0 45px 40px;

      padding:
        30px 32px 32px;

      background:
        #fffafa;

      border:
        1px solid #efdfe2;

      border-radius: 12px;
    }


    .form-heading {

      color: #172b4d;

      font-size: 22px;

      line-height: 1.3;

      font-weight: 800;

      margin-bottom: 6px;
    }


    .form-heading-subtitle {

      color: #778397;

      font-size: 13px;

      line-height: 1.5;

      margin-bottom: 25px;
    }


    /* =========================================================
       MESSAGE
       ========================================================= */

    .message {

      display: none;

      padding:
        13px 15px;

      margin-bottom: 20px;

      border-radius: 8px;

      font-size: 13px;

      line-height: 1.5;

      font-weight: 600;
    }


    .message.success {

      display: block;

      color: #166534;

      background: #ecfdf3;

      border:
        1px solid #bbf7d0;
    }


    .message.error {

      display: block;

      color: #991b1b;

      background: #fff1f2;

      border:
        1px solid #fecdd3;
    }


    /* =========================================================
       FIELD
       ========================================================= */

    .field {

      margin-bottom: 18px;
    }


    .field label {

      display: block;

      color: #253858;

      font-size: 13px;

      line-height: 1.4;

      font-weight: 700;

      margin-bottom: 7px;
    }


    .required {

      color: #A6192E;
    }


    /* =========================================================
       INPUT
       ========================================================= */

    .input {

      width: 100%;

      height: 50px;

      padding:
        0 15px;

      border:
        1px solid #d4dbe3;

      border-radius: 7px;

      background: #ffffff;

      color: #172b4d;

      font-family:
        "Open Sans",
        Arial,
        sans-serif;

      font-size: 14px;

      outline: none;

      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
    }


    .input::placeholder {

      color: #a3acb8;
    }


    .input:hover {

      border-color: #b8c1cc;
    }


    .input:focus {

      border-color: #A6192E;

      background: #ffffff;

      box-shadow:
        0 0 0 3px
        rgba(166, 25, 46, 0.08);
    }


    /* =========================================================
       MOBILE NUMBER
       ========================================================= */

    .mobile-wrap {

      display: flex;

      width: 100%;
    }


    .country-code {

      width: 62px;

      height: 50px;

      display: flex;

      align-items: center;

      justify-content: center;

      flex-shrink: 0;

      background: #f7f8fa;

      color: #253858;

      font-size: 13px;

      font-weight: 700;

      border:
        1px solid #d4dbe3;

      border-right: none;

      border-radius:
        7px 0 0 7px;
    }


    .mobile-input {

      border-radius:
        0 7px 7px 0;
    }


    /* =========================================================
       CONSENT
       ========================================================= */

    .consent-box {

      display: flex;

      align-items: flex-start;

      gap: 10px;

      margin-top: 5px;

      margin-bottom: 22px;

      padding:
        13px 14px;

      background:
        #ffffff;

      border:
        1px solid #eadcdf;

      border-radius: 8px;
    }


    .consent-checkbox {

      width: 17px;

      height: 17px;

      flex:
        0 0 17px;

      margin-top: 1px;

      accent-color: #A6192E;

      cursor: pointer;
    }


    .consent-label {

      color: #697586;

      font-size: 11px;

      line-height: 1.55;

      cursor: pointer;
    }


    .consent-label strong {

      color: #253858;

      font-weight: 700;
    }


    /* =========================================================
       SUBMIT BUTTON
       ========================================================= */

    .submit-btn {

      width: 100%;

      height: 52px;

      border: none;

      border-radius: 7px;

      background: #A6192E;

      color: #ffffff;

      font-family:
        "Open Sans",
        Arial,
        sans-serif;

      font-size: 14px;

      font-weight: 700;

      cursor: pointer;

      box-shadow:
        0 6px 15px
        rgba(166, 25, 46, 0.20);

      transition:
        background 0.2s ease,
        transform 0.2s ease,
        box-shadow 0.2s ease,
        opacity 0.2s ease;
    }


    .submit-btn:hover {

      background: #8f1427;

      transform:
        translateY(-1px);

      box-shadow:
        0 9px 20px
        rgba(166, 25, 46, 0.25);
    }


    .submit-btn:active {

      transform:
        translateY(0);
    }


    .submit-btn:disabled {

      opacity: 0.65;

      cursor: not-allowed;

      transform: none;

      box-shadow: none;
    }


    .button-content {

      display: inline-flex;

      align-items: center;

      justify-content: center;

      gap: 8px;
    }


    .button-arrow {

      font-size: 18px;

      line-height: 1;
    }


    /* =========================================================
       LOADER
       ========================================================= */

    .loader {

      display: none;

      width: 16px;

      height: 16px;

      border:
        2px solid
        rgba(255,255,255,0.40);

      border-top-color:
        #ffffff;

      border-radius: 50%;

      animation:
        spin 0.8s linear infinite;
    }


    @keyframes spin {

      to {

        transform:
          rotate(360deg);
      }
    }


    /* =========================================================
       SECURITY NOTE
       ========================================================= */

    .security {

      text-align: center;

      color: #8a95a3;

      font-size: 10.5px;

      line-height: 1.5;

      margin-top: 14px;
    }


    /* =========================================================
       FOOTER
       ========================================================= */

    .footer {

      text-align: center;

      padding:
        22px 15px 0;

      color: #929aa6;

      font-size: 10px;

      line-height: 1.5;
    }


    /* =========================================================
       TABLET
       ========================================================= */

    @media (max-width: 700px) {

      .page {

        padding:
          30px 15px 45px;
      }


      .container {

        max-width: 600px;
      }


      .brand {

        padding:
          30px 28px 0;
      }


      .logo {

        width: 165px;

        margin-bottom: 22px;
      }


      .intro {

        padding:
          27px 28px 25px;
      }


      .report-title {

        font-size: 26px;
      }


      .description {

        font-size: 14px;

        line-height: 1.65;
      }


      .form-area {

        margin:
          0 25px 30px;

        padding:
          25px 22px 27px;
      }
    }


    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 480px) {

      body {

        background:
          linear-gradient(
            145deg,
            #ffffff 0%,
            #ffffff 70%,
            #fff8f9 100%
          );
      }


      .page {

        padding:
          15px 10px 35px;
      }


      .card {

        border-radius: 12px;

        border-top-width: 4px;

        box-shadow:
          0 7px 24px
          rgba(55, 20, 28, 0.08);
      }


      .brand {

        padding:
          24px 20px 0;
      }


      .logo {

        width: 145px;

        max-width: 75%;

        margin-bottom: 19px;
      }


      .brand-divider {

        height: 2px;
      }


      .intro {

        padding:
          24px 20px 22px;
      }


      .report-title {

        font-size: 22px;

        line-height: 1.3;

        letter-spacing: -0.25px;

        margin-bottom: 12px;
      }


      .description {

        font-size: 12.5px;

        line-height: 1.65;
      }


      .form-area {

        margin:
          0 15px 25px;

        padding:
          22px 17px 22px;

        border-radius: 9px;
      }


      .form-heading {

        font-size: 19px;

        margin-bottom: 5px;
      }


      .form-heading-subtitle {

        font-size: 11.5px;

        margin-bottom: 20px;
      }


      .field {

        margin-bottom: 15px;
      }


      .field label {

        font-size: 11.5px;

        margin-bottom: 6px;
      }


      .input {

        height: 46px;

        padding:
          0 12px;

        font-size: 12.5px;

        border-radius: 6px;
      }


      .country-code {

        width: 54px;

        height: 46px;

        font-size: 12px;

        border-radius:
          6px 0 0 6px;
      }


      .mobile-input {

        border-radius:
          0 6px 6px 0;
      }


      .consent-box {

        gap: 8px;

        padding:
          10px 11px;

        margin-bottom: 18px;
      }


      .consent-checkbox {

        width: 15px;

        height: 15px;

        flex-basis: 15px;
      }


      .consent-label {

        font-size: 9.5px;

        line-height: 1.5;
      }


      .submit-btn {

        height: 48px;

        font-size: 13px;

        border-radius: 6px;
      }


      .security {

        font-size: 9px;

        margin-top: 11px;
      }


      .footer {

        padding-top: 17px;

        font-size: 9px;
      }
    }


    /* =========================================================
       VERY SMALL PHONES
       ========================================================= */

    @media (max-width: 350px) {

      .page {

        padding-left: 7px;

        padding-right: 7px;
      }


      .brand {

        padding-left: 15px;

        padding-right: 15px;
      }


      .intro {

        padding-left: 15px;

        padding-right: 15px;
      }


      .form-area {

        margin-left: 10px;

        margin-right: 10px;

        padding-left: 13px;

        padding-right: 13px;
      }


      .report-title {

        font-size: 20px;
      }


      .description {

        font-size: 11.5px;
      }
    }

  </style>

</head>


<body>

  <div class="page">

    <div class="container">

      <div class="card">


        <!-- ===================================================
             LOGO
             =================================================== -->

        <div class="brand">

          <? if (logoDataUri) { ?>

            <img
              src="<?!= logoDataUri ?>"
              alt="Equifax"
              class="logo"
            >

          <? } else { ?>

            <div
              style="
                color:#A6192E;
                font-size:42px;
                font-weight:800;
                font-style:italic;
                letter-spacing:-2px;
                margin-bottom:25px;
              "
            >
              EQUIFAX<sup style="font-size:12px;">®</sup>
            </div>

          <? } ?>

          <div class="brand-divider"></div>

        </div>


        <!-- ===================================================
             REPORT INTRODUCTION
             =================================================== -->

        <div class="intro">

          <h1 class="report-title">

            Aspirational India -

            <span class="highlight">
              <?= config.formType ?> Report
            </span>

          </h1>


          <p class="description">

            <?= config.reportDescription ?>

          </p>

        </div>


        <!-- ===================================================
             FORM AREA
             =================================================== -->

        <div class="form-area">


          <h2 class="form-heading">
            Request the Report
          </h2>


          <p class="form-heading-subtitle">
            <?= config.closingText ?>
          </p>


          <!-- MESSAGE -->

          <div
            id="message"
            class="message"
          ></div>


          <!-- =================================================
               FORM
               ================================================= -->

          <form
            id="reportForm"
            onsubmit="handleSubmit(event)"
            novalidate
          >


            <!-- NAME -->

            <div class="field">

              <label for="name">

                Name

                <span class="required">*</span>

              </label>


              <input
                class="input"
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
                autocomplete="name"
                maxlength="100"
                required
              >

            </div>


            <!-- COMPANY NAME -->

            <div class="field">

              <label for="companyName">

                Company Name

                <span class="required">*</span>

              </label>


              <input
                class="input"
                type="text"
                id="companyName"
                name="companyName"
                placeholder="Enter company name"
                autocomplete="organization"
                maxlength="150"
                required
              >

            </div>


            <!-- DESIGNATION -->

            <div class="field">

              <label for="designation">

                Designation

                <span class="required">*</span>

              </label>


              <input
                class="input"
                type="text"
                id="designation"
                name="designation"
                placeholder="Enter your designation"
                autocomplete="organization-title"
                maxlength="100"
                required
              >

            </div>


            <!-- MOBILE -->

            <div class="field">

              <label for="mobile">

                Mobile Number

                <span class="required">*</span>

              </label>


              <div class="mobile-wrap">

                <div class="country-code">
                  +91
                </div>


                <input
                  class="input mobile-input"
                  type="tel"
                  id="mobile"
                  name="mobile"
                  placeholder="Enter your mobile number"
                  maxlength="10"
                  inputmode="numeric"
                  autocomplete="tel"
                  required
                  oninput="
                    this.value =
                    this.value
                      .replace(/[^0-9]/g,'')
                      .slice(0,10)
                  "
                >

              </div>

            </div>


            <!-- EMAIL -->

            <div class="field">

              <label for="email">

                Email ID

                <span class="required">*</span>

              </label>


              <input
                class="input"
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email ID"
                autocomplete="email"
                maxlength="150"
                required
              >

            </div>


            <!-- =================================================
                 CONSENT
                 ================================================= -->

            <div class="consent-box">

              <input
                type="checkbox"
                id="consent"
                name="consent"
                class="consent-checkbox"
                required
              >


              <label
                for="consent"
                class="consent-label"
              >

                I hereby give my consent to the
                <strong>Equifax team</strong>
                to contact me regarding this report,
                relevant products, services, and business
                opportunities using the contact details
                provided above.

              </label>

            </div>


            <!-- =================================================
                 SUBMIT
                 ================================================= -->

            <button
              type="submit"
              class="submit-btn"
              id="submitBtn"
            >

              <span class="button-content">

                <span
                  class="loader"
                  id="loader"
                ></span>


                <span id="buttonText">
                  Get the Report
                </span>


                <span
                  class="button-arrow"
                  id="buttonArrow"
                >
                  →
                </span>

              </span>

            </button>


          </form>


          <!-- SECURITY -->

          <div class="security">

            Your information is secure with Equifax.

          </div>


        </div>


      </div>


      <!-- =====================================================
           FOOTER
           ===================================================== -->

      <div class="footer">

        © Equifax. All rights reserved.

      </div>

    </div>

  </div>


  <!-- =========================================================
       JAVASCRIPT
       ========================================================= -->

  <script>


    /* =========================================================
       FORM SUBMISSION
       ========================================================= */

    function handleSubmit(event) {

      event.preventDefault();


      const form =
        document.getElementById(
          'reportForm'
        );


      const submitBtn =
        document.getElementById(
          'submitBtn'
        );


      const buttonText =
        document.getElementById(
          'buttonText'
        );


      const buttonArrow =
        document.getElementById(
          'buttonArrow'
        );


      const loader =
        document.getElementById(
          'loader'
        );


      const message =
        document.getElementById(
          'message'
        );


      /* =======================================================
         GET VALUES
         ======================================================= */

      const name =
        document
          .getElementById('name')
          .value
          .trim();


      const companyName =
        document
          .getElementById('companyName')
          .value
          .trim();


      const designation =
        document
          .getElementById('designation')
          .value
          .trim();


      const mobile =
        document
          .getElementById('mobile')
          .value
          .trim();


      const email =
        document
          .getElementById('email')
          .value
          .trim();


      const consent =
        document
          .getElementById('consent')
          .checked;


      /* =======================================================
         CLEAR MESSAGE
         ======================================================= */

      message.className =
        'message';

      message.textContent =
        '';


      /* =======================================================
         NAME VALIDATION
         ======================================================= */

      if (!name) {

        showMessage(
          'Please enter your name.',
          'error'
        );

        document
          .getElementById('name')
          .focus();

        return;
      }


      /* =======================================================
         COMPANY VALIDATION
         ======================================================= */

      if (!companyName) {

        showMessage(
          'Please enter your company name.',
          'error'
        );

        document
          .getElementById('companyName')
          .focus();

        return;
      }


      /* =======================================================
         DESIGNATION VALIDATION
         ======================================================= */

      if (!designation) {

        showMessage(
          'Please enter your designation.',
          'error'
        );

        document
          .getElementById('designation')
          .focus();

        return;
      }


      /* =======================================================
         MOBILE VALIDATION
         ======================================================= */

      if (
        !/^[6-9][0-9]{9}$/.test(
          mobile
        )
      ) {

        showMessage(
          'Please enter a valid 10-digit Indian mobile number.',
          'error'
        );

        document
          .getElementById('mobile')
          .focus();

        return;
      }


      /* =======================================================
         EMAIL VALIDATION
         ======================================================= */

      const emailPattern =
        /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


      if (
        !emailPattern.test(email)
      ) {

        showMessage(
          'Please enter a valid email address.',
          'error'
        );

        document
          .getElementById('email')
          .focus();

        return;
      }


      /* =======================================================
         CONSENT VALIDATION
         ======================================================= */

      if (!consent) {

        showMessage(
          'Please provide your consent to continue.',
          'error'
        );

        return;
      }


      /* =======================================================
         DISABLE BUTTON
         ======================================================= */

      submitBtn.disabled =
        true;


      loader.style.display =
        'inline-block';


      buttonText.textContent =
        'Sending...';


      buttonArrow.style.display =
        'none';


      /* =======================================================
         FORM DATA
         ======================================================= */

      const formData = {

        name:
          name,

        companyName:
          companyName,

        designation:
          designation,

        mobile:
          mobile,

        email:
          email,

        consent:
          consent

      };


      /* =======================================================
         SEND TO CODE.GS
         ======================================================= */

      google.script.run

        .withSuccessHandler(
          function(response) {


            /* ================================================
               RE-ENABLE BUTTON
               ================================================ */

            submitBtn.disabled =
              false;


            loader.style.display =
              'none';


            buttonText.textContent =
              'Get the Report';


            buttonArrow.style.display =
              'inline';


            /* ================================================
               RESPONSE
               ================================================ */

            if (
              response &&
              response.success
            ) {

              showMessage(
                response.message ||
                'Thank you. Please check your email for the report.',
                'success'
              );


              /* ==============================================
                 CLEAR FORM
                 ============================================== */

              form.reset();

            }

            else {

              showMessage(
                response &&
                response.message
                  ? response.message
                  : 'Unable to send the report. Please try again.',
                'error'
              );

            }

          }
        )

        .withFailureHandler(
          function(error) {


            /* ================================================
               RE-ENABLE BUTTON
               ================================================ */

            submitBtn.disabled =
              false;


            loader.style.display =
              'none';


            buttonText.textContent =
              'Get the Report';


            buttonArrow.style.display =
              'inline';


            /* ================================================
               USER-FRIENDLY ERROR
               ================================================ */

            showMessage(
              'Unable to send the report. Please try again.',
              'error'
            );

          }
        )

        .submitForm(
          formData,
          '<?= formType ?>'
        );

    }


    /* =========================================================
       SHOW MESSAGE
       ========================================================= */

    function showMessage(
      text,
      type
    ) {

      const message =
        document.getElementById(
          'message'
        );


      message.textContent =
        text;


      message.className =
        'message ' +
        type;


      message.scrollIntoView({
        behavior: 'smooth',
        block: 'nearest'
      });

    }


  </script>
